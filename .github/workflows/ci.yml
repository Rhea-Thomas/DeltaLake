name: unit-tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Cache Maven/Ivy jars (Delta)
        uses: actions/cache@v4
        with:
          path: ~/.ivy2
          key: ivy-${{ hashFiles('requirements.txt') }}
      - run: pip install -r requirements.txt
      - name: Unit tests (data quality, silver merge, SCD2) - no Docker
        run: pytest tests/unit -q
