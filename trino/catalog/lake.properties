# Delta Lake connector reading the same tables Spark writes.
# The lake directory is mounted at /lake (file:// via Trino's Hadoop file-system
# layer; on a real deployment this would be s3:// or abfs://). Tables are
# registered (not copied) into a file-based metastore with system.register_table.
connector.name=delta_lake
fs.hadoop.enabled=true
hive.metastore=file
hive.metastore.catalog.dir=file:///lake/_trino_metastore
delta.register-table-procedure.enabled=true
# Let tables live in lake/<layer>/<table> instead of inside the metastore dir,
# so dbt-built gold tables sit next to bronze/silver in the lake.
hive.metastore.disable-location-checks=true
# INSERT/MERGE into an existing Delta table needs an atomic "create log entry
# if absent". Local file systems do not offer that through Trino, so Trino
# refuses such writes unless told the table has a single writer. That holds
# here: only dbt (one run at a time, scheduled by Airflow) writes the gold
# tables; Spark never writes gold, and Trino never writes bronze/silver.
delta.enable-non-concurrent-writes=true
# Name table directories after the table (lake/gold/fct_orders) rather than
# table name + random suffix, so dbt rebuilds replace the same directory.
delta.unique-table-location=false
