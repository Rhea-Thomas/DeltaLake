lakehouse:
  target: local
  outputs:
    local:
      type: trino
      method: none
      user: dbt
      host: "{{ env_var('TRINO_HOST', 'localhost') }}"
      port: "{{ env_var('TRINO_PORT', '8080') | int }}"
      database: lake          # Trino catalog backed by the Delta Lake connector
      schema: gold
      threads: 4
      http_scheme: http
