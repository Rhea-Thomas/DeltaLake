# Infrastructure for the CDC pipeline. Spark runs on the host (see Makefile),
# so only the source database and the streaming backbone live in containers.
#
# Pinned versions (tested together):
#   postgres:16.4                       - source OLTP database, logical decoding via pgoutput
#   apache/kafka:3.8.1                  - single-node KRaft broker+controller (no ZooKeeper)
#   quay.io/debezium/connect:2.7.3.Final - Kafka Connect runtime with the Debezium connectors
#   trinodb/trino:465                   - distributed SQL engine, Delta Lake connector over ./lake
name: deltalake

services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shop
    command:
      - postgres
      - -c
      - wal_level=logical          # required for logical decoding (CDC)
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
    ports:
      - "5433:5432"                # 5433 on the host to avoid a local Postgres on 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shop"]
      interval: 2s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:3.8.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL is used by Kafka Connect inside the compose network,
      # EXTERNAL by Spark running on the host.
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 3s
      timeout: 10s
      retries: 40

  connect:
    image: quay.io/debezium/connect:2.7.3.Final
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: deltalake-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_FLUSH_INTERVAL_MS: 1000
      # Incremental cooperative rebalancing holds a lost worker's tasks for this
      # long before reassigning them (default 5 min). With one worker, that is
      # how long Debezium stays UNASSIGNED after a Kafka outage. Found by the
      # Kafka-broker failure-injection test.
      CONNECT_SCHEDULED_REBALANCE_MAX_DELAY_MS: 10000
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/connectors > /dev/null"]
      interval: 3s
      timeout: 5s
      retries: 60

  trino:
    image: trinodb/trino:465
    ports:
      - "8080:8080"
    volumes:
      - ./trino/catalog/lake.properties:/etc/trino/catalog/lake.properties:ro
      - ./lake:/lake
    healthcheck:
      test: ["CMD-SHELL", "trino --execute \"SELECT count(*) FROM system.runtime.nodes WHERE state = 'active'\" 2>/dev/null | grep -q 1"]
      interval: 5s
      timeout: 10s
      retries: 40
